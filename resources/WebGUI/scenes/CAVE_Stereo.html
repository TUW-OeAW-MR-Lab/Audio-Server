<div id="CAVE_Stereo" class="scene-main">

  <h3>Plays stereo audio via the CAVE loudspeakers.</h3>

  <div class="start-container" style="height: 80%;">
    
    <div class="button-group" style="width: 35%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">Inputs</span>
      <div class="start-container" style="height: 100%; gap: 0px;">
        <div id="input-buttons-container" style="text-align: center;">
          <!-- Input buttons will be injected here by input-controls.js -->
        </div>
        <div id="input-group-container" class="input-group" style="text-align: center; gap: 0px;">
          <!-- Input sections will be injected here by input-controls.js -->
        </div>
      </div>
    </div>
    
    <div class="button-group" style="width: 65%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">CAVE Stereo</span>
      
      <div class="start-container" style="height: 95%; text-align: center; gap: 0px; justify-content: space-evenly; align-items: stretch;">
        <div class="slider-group" style="width: 12.5%; height: 100%; justify-content: flex-start; padding-top: 130px;">
          <b>BL</b>
          <button id="btn-sum_bus_CAVE_BL-mute" class="small-button" style="width: 45px; padding: 5px 0;" onclick="SceneModule.toggleMute('BL')">Off</button>          
          <input id="sum_bus_CAVE_BL-volume-slider" class="volume-slider" style="height: 190px; opacity: 0.5; margin: 8px 0px;" type="range" min="-100" max="18" value="0" 
            oninput="SceneModule.setVolume('BL', this.value)">
          <div id="sum_bus_CAVE_BL-volume-number" class="level-box" style="width: 55px; font-size: 0.8rem; padding: 3px 2px;">--</div>
          <span style="text-align: center; color: white; font-size: 0.8rem;" id="sum_bus_CAVE_BL-gain">&nbsp;</span>
        </div>

        <div class="slider-group" style="width: 12.5%; height: 100%; justify-content: flex-start; padding-top: 90px;">
          <b>SL</b>
          <button id="btn-sum_bus_CAVE_SL-mute" class="small-button" style="width: 45px; padding: 5px 0;" onclick="SceneModule.toggleMute('SL')">Off</button>

        </div>

  <div class="start-container" style="height: 8%; width: 100%; justify-content: center;">
    <button onClick="SceneModule.GetStatus()" class="big-button">Get Routing Status</button>
    &nbsp;
    <button class="big-button" onClick="SceneModule.MuteAll();">Mute All</button>
