<div id="Curved_LED_Stereo" class="scene-main">

  <h3>Plays stereo audio via the Curved-LED loudspeakers. The spatial-audio area is not used.</h3>

  <div class="start-container" style="height: 80%;">
    
    <div class="button-group" style="width: 66%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">Inputs</span>
      <div class="start-container" style="height: 100%; gap: 0px;">
        <div id="input-buttons-container" style="text-align: center;">
          <!-- Input buttons will be injected here by input-controls.js -->
        </div>
        <div id="input-group-container" class="input-group" style="text-align: center; gap: 0px;">
          <!-- Input sections will be injected here by input-controls.js -->
        </div>
      </div>
		</div>
    
    <div class="button-group" style="width: 33%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">PA</span>
      
        <div class="slider-group">
          <b>Volume</b>
          <button id="btn-sum_bus_PA-mute" class="small-button" style="width: 50px;" onclick="SceneModule.toggleSumBusPAMute()">Off</button>          
          <input id="sum_bus_PA-volume-slider" class="volume-slider" style="height: 350px; opacity: 0.5" type=range min="-100" max="18" value="0" 
            oninput="sendValue('/matrix/state/settings/sum_bus_master/0/gain', this.value); sendValue('/matrix/state/settings/sum_bus_master/1/gain', this.value); document.getElementById('sum_bus_PA-volume-number').innerText = this.value + ' dB';">
          <div id="sum_bus_PA-volume-number" class="level-box">--</div>
          <span style="text-align: center; color: white;" id="sum_bus_PA-gain">&nbsp;</span>
        </div>
    </div>
  </div>
  
  <div class="start-container" style="height: 8%; width: 100%; justify-content: center;">
    <button onClick="SceneModule.GetStatus()" class="big-button">Get Routing Status</button>
    &nbsp;
    <button class="big-button" onClick="SceneModule.MuteAll();">Mute All</button>
  </div>

</div>
