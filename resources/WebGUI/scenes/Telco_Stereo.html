<div id="Telco_Stereo" class="scene-main">

  <h3>Plays teleconference stereo audio via CAVE and Curved-LED loudspeakers.</h3>

  <div class="start-container" style="height: 80%;">
    
    <div class="button-group" style="width: 45%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">Inputs from:</span>
      <div class="start-container" style="height: 100%; gap: 0px;">
        <div id="input-buttons-container" style="text-align: center;">
          <!-- Input buttons will be injected here by input-controls.js -->
        </div>
        <div id="input-group-container" class="input-group" style="text-align: center; gap: 0px;">
          <!-- Input sections will be injected here by input-controls.js -->
        </div>
      </div>
    </div>
    
    <div class="button-group" style="width: 25%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">Recording by:</span>
      <div class="start-container" style="height: 100%; gap: 0px; justify-content: center; align-items: center;">
        <div id="direct-buttons-container" style="text-align: center; width: 100%;">
          <div style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <button id="btn-direct-select-DANTE_CurvedLEDPC" onClick="SceneModule.SetCurvedLedPc();" class="big-button">&nbsp;<br>Curved LED PC<br>&nbsp;</button>
            <button id="btn-direct-select-DANTE_CAVEPC" onClick="SceneModule.SetCavePc();" class="big-button">&nbsp;<br>CAVE PC<br>&nbsp;</button>
            <button id="btn-direct-select-Curved_Wall_Bluetooth_Stereo" onClick="SceneModule.SetCurvedBluetooth();" class="big-button">&nbsp;<br>Curved Bluetooth<br>&nbsp;</button>
            <button id="btn-direct-select-DANTE_Mobile" onClick="SceneModule.SetDanteMobile();" class="big-button">&nbsp;<br>Mobile Dante<br>&nbsp;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="button-group" style="width: 30%; height: 100%; gap: 0px;">
      <span style="text-align: center; font-weight: bold; gap: 0px;">Playback via:</span>
      <div class="start-container" style="height: 100%; width: 100%; justify-content: space-evenly; gap: 0px; border: none;">
        
        <div class="slider-group">
          <b>CAVE PA</b>
          <button id="btn-sum_bus_CAVEPA-mute" class="small-button" style="width: 50px;" onclick="SceneModule.toggleStateCAVEPA()">Off</button>          
          <input id="sum_bus_CAVEPA-volume-slider" class="volume-slider" style="height: 350px; opacity: 0.5;" type="range" min="-100" max="18" value="0" 
            oninput="SceneModule.setVolumeCavePA(this.value)">
          <div id="sum_bus_CAVEPA-volume-number" class="level-box">--</div>
          <span style="text-align: center; color: white;" id="sum_bus_CAVEPA-gain">&nbsp;</span>
        </div>

        <div class="slider-group">
          <b>Curved PA</b>
          <button id="btn-sum_bus_CurvedPA-mute" class="small-button" style="width: 50px;" onclick="SceneModule.toggleSumBusCurvedPAMute()">Off</button>          
          <input id="sum_bus_CurvedPA-volume-slider" class="volume-slider" style="height: 350px; opacity: 0.5;" type="range" min="-100" max="18" value="0" 
            oninput="SceneModule.setVolumeCurvedPA(this.value)">
          <div id="sum_bus_CurvedPA-volume-number" class="level-box">--</div>
          <span style="text-align: center; color: white;" id="sum_bus_CurvedPA-gain">&nbsp;</span>
        </div>

      </div>
    </div>

  </div>
  
  <div class="start-container" style="height: 8%; width: 100%; justify-content: center;">
    <button onClick="SceneModule.GetStatus()" class="big-button">Get Routing Status</button>
    &nbsp;
    <button class="big-button" onClick="SceneModule.MuteAll();">Mute All</button>
    &nbsp;
    <button class="big-button" onClick="SceneModule.ResetDefaultRouting();">Reset to Default</button>
  </div>

</div>
